[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cncdt-ml"
version = "0.1.0"
description = "Codul de machine learning al proiectului CNC Digital Twin: caracteristici, antrenare, inferență"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Pandas și pyarrow sunt necesare doar pentru căile Parquet și pentru Data Wrangler.
data = ["pyarrow>=15.0"]
sagemaker = ["sagemaker>=2.200", "boto3>=1.34"]
train = ["scikit-learn>=1.3", "pandas>=2.0", "joblib>=1.3"]
vision = ["torch>=2.2", "torchvision>=0.17", "pillow>=10.0"]
dev = ["pytest>=7.4", "ruff>=0.5", "diagrams>=0.24"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
