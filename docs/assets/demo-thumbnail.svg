<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="CNC Digital Twin — video demonstrativ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

  <text x="80" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="72" font-weight="700" fill="#f8fafc">CNC Digital Twin</text>
  <text x="80" y="204" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="28" font-weight="400" fill="#94a3b8">Enterprise Serverless · Isaac Sim · AWS</text>

  <text x="80" y="286" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="30" font-weight="600" fill="#e2e8f0">Bucla completă, de la simulare la reacția fizică</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600">
    <rect x="80"  y="340" width="200" height="84" rx="14" fill="#132a3d" stroke="#22d3ee" stroke-width="2"/>
    <text x="180" y="378" text-anchor="middle" fill="#67e8f9">1. Isaac Sim</text>
    <text x="180" y="406" text-anchor="middle" fill="#94a3b8" font-size="18" font-weight="400">date + cameră QA</text>

    <rect x="300" y="340" width="200" height="84" rx="14" fill="#13273d" stroke="#38bdf8" stroke-width="2"/>
    <text x="400" y="378" text-anchor="middle" fill="#7dd3fc">2. Ingestie</text>
    <text x="400" y="406" text-anchor="middle" fill="#94a3b8" font-size="18" font-weight="400">IoT → Firehose → S3</text>

    <rect x="520" y="340" width="200" height="84" rx="14" fill="#1b2540" stroke="#818cf8" stroke-width="2"/>
    <text x="620" y="378" text-anchor="middle" fill="#a5b4fc">3. Hot path</text>
    <text x="620" y="406" text-anchor="middle" fill="#94a3b8" font-size="18" font-weight="400">Lambda + modele ML</text>

    <rect x="740" y="340" width="200" height="84" rx="14" fill="#221f3d" stroke="#c084fc" stroke-width="2"/>
    <text x="840" y="378" text-anchor="middle" fill="#d8b4fe">4. Monitoring</text>
    <text x="840" y="406" text-anchor="middle" fill="#94a3b8" font-size="18" font-weight="400">CloudWatch + SNS</text>

    <rect x="960" y="340" width="240" height="84" rx="14" fill="#20283a" stroke="#34d399" stroke-width="2"/>
    <text x="1080" y="378" text-anchor="middle" fill="#6ee7b7">5. Comandă înapoi</text>
    <text x="1080" y="406" text-anchor="middle" fill="#94a3b8" font-size="18" font-weight="400">SQS → IoT → piston</text>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <circle cx="620" cy="530" r="46" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
    <path d="M604 508 L604 552 L644 530 Z" fill="#22d3ee"/>
    <text x="700" y="524" font-size="30" font-weight="600" fill="#f8fafc">Video demonstrativ</text>
    <text x="700" y="556" font-size="22" fill="#94a3b8">înlocuiți linkul din README cu înregistrarea</text>
  </g>

  <text x="80" y="650" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="20" fill="#64748b">make up · make sim-connect · make down</text>
</svg>
