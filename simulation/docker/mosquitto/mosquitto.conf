# Broker MQTT pentru dezvoltare locală.
#
# Acesta imită AWS IoT Core în două privințe: acceptă MQTT simplu pe 1883 și oferă un
# listener TLS pe 8883 unde pot fi montate certificatele dispozitivului generate de Terraform
# (vezi simulation/scripts/gen-iot-certs.sh).
#
# Anonim este permis doar pe listenerul de dezvoltare. Nu folosiți această configurație
# în afara mașinii locale.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Listener de dezvoltare, fără autentificare.
listener 1883 0.0.0.0
allow_anonymous true

# Listener pentru WebSockets, util la depanare din browser.
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# Listener TLS cu certificate de dispozitiv, pentru a reproduce mTLS din AWS IoT Core.
# Decomentați după ce rulați `simulation/scripts/gen-iot-certs.sh`.
#
# listener 8883 0.0.0.0
# allow_anonymous false
# cafile   /mosquitto/config/certs/AmazonRootCA1.pem
# certfile /mosquitto/config/certs/device.pem.crt
# keyfile  /mosquitto/config/certs/private.pem.key
# require_certificate true
