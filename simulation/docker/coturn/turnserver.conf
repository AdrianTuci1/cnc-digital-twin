# coturn — server TURN/STUN pentru acces la fluxul Isaac Sim fără tunel SSH.
#
# De ce este necesar: WebRTC negociază media pe UDP. Un tunel SSH sau Session Manager
# transportă doar TCP, deci imaginea nu poate trece prin el decât dacă media este
# relayată prin TCP. coturn rezolvă exact asta.
#
# Pornire pe instanță:
#   sudo systemctl start coturn
#
# Clientul Isaac Sim se configurează cu:
#   { "iceTransportsType": "relay", "turnServer": "turn:<ip>:3478", ... }
#
# Credențialele NU stau în acest fișier. Se citesc din AWS SSM Parameter Store:
#   aws ssm get-parameter --name /cncdt/<mediu>/turn/credentials --with-decryption

listening-port=3478
# Ascultă și pe TCP, pentru clienți aflați în spatele unui firewall restrictiv.
tcp-listening-port=3478

fingerprint
lt-cred-mech
realm=cncdt.local

# Intervalul de porturi pentru relay. Trebuie să fie deschis în security group.
min-port=49160
max-port=49200

# Se completează la runtime cu IP-ul public al instanței.
# external-ip=<IP_PUBLIC>

# Fără CLI și fără multicast: reduce suprafața de atac.
no-cli
no-multicast-peers
no-tcp-relay=0

# Limite de siguranță.
total-quota=100
bps-capacity=0
stale-nonce=600

# Jurnalizare către syslog, colectată apoi de CloudWatch Agent.
log-file=syslog
simple-log

# Certificate pentru TURN peste TLS (opțional, necesită domeniu valid).
# cert=/etc/ssl/certs/turn.pem
# pkey=/etc/ssl/private/turn.key
