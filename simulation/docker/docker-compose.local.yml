# Mediu local de dezvoltare: broker MQTT și stocare compatibilă S3.
# Permite testarea întregului pipeline de date fără Isaac Sim și fără AWS.
#
#   docker compose -f simulation/docker/docker-compose.local.yml up -d
#   make publish-dev
#   deschideți http://localhost:9001 pentru consola MinIO (minioadmin / minioadmin)

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cncdt-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT simplu, pentru publicatorul de dezvoltare
      - "9001:9001"   # MQTT peste WebSockets
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      # `$$` escapează dolarul: altfel Compose încearcă să interpoleze $SYS.
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 30s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: cncdt-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API compatibil S3
      - "9002:9001"   # consola web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Creează bucket-urile așteptate de cod, apoi se oprește.
  minio-init:
    image: minio/mc:latest
    container_name: cncdt-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/cncdt-dev-datalake &&
      mc mb --ignore-existing local/cncdt-dev-assets &&
      echo 'bucket-uri create' &&
      exit 0
      "

volumes:
  mosquitto-data:
  minio-data:
